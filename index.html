<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f2ff"><title>Bubbiq — Little pops, big progress</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#403753;background:#faf7ff}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,32px)}button,input{font:inherit}button{cursor:pointer}.layout{max-width:1300px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;min-height:calc(100dvh - 64px)}.panel,.scene{border:1px solid #e9dff5;border-radius:24px;padding:24px;background:#fff;box-shadow:0 8px 30px #8b75b40c}.panel{display:flex;flex-direction:column;gap:24px}.scene{display:flex;flex-direction:column;gap:14px;background:linear-gradient(145deg,#f9f2ff,#effbff 60%,#fff2f8)}h1{font-size:26px;margin:0}.sub{font-size:13px;color:#857795}.count{font-size:52px;font-weight:800;line-height:1.1}input[type=range]{width:100%;accent-color:#a58be8}.step{display:flex;align-items:center;justify-content:space-between;gap:8px}.step button,.action{border:1px solid #e5dbee;border-radius:12px;background:#faf7ff;color:#403753;padding:10px 14px}.step button{font-size:24px;min-width:46px}.step strong{font-size:23px}.actions{margin-top:auto;display:grid;gap:10px}.heading,.stats{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats strong{font-size:28px}.bar{height:11px;background:#e9e3f2;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ad90f3,#80d4dc);border-radius:20px;transition:width .3s}.sky{position:relative;flex:1;min-height:420px;overflow:hidden;border-radius:18px}.bubble{position:absolute;border-radius:50%;border:1px solid #ffffffcc;background:radial-gradient(circle at 28% 24%,#fff 0%,#ffffff55 18%,transparent 43%),radial-gradient(circle at 70% 80%,#e9b9f4,#a8e0f0 48%,#b5a5f1 85%);box-shadow:inset -7px -8px 15px #6855a52a,inset 4px 4px 10px #ffffffb0,0 6px 18px #7764b42b;animation:drift var(--duration) ease-in-out infinite alternate;animation-delay:var(--delay);transform:translate(-50%,-50%);touch-action:manipulation;will-change:transform}.bubble:nth-child(3n){filter:hue-rotate(42deg)}.bubble:nth-child(4n){filter:hue-rotate(-26deg)}.bubble:hover{box-shadow:0 0 24px #b39bed99,inset 3px 4px 10px #fff}.bubble.popping{animation:burst .28s ease-out forwards!important;pointer-events:none}@keyframes drift{from{transform:translate(calc(-50% - var(--dx)),calc(-50% - var(--dy)))}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5);opacity:.8}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}.finished{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:24px;font-weight:750;pointer-events:none}.foot{text-align:center;color:#857795;font-size:13px}@media(max-width:650px){body{padding:9px}.layout{grid-template-columns:115px minmax(0,1fr);gap:8px;min-height:calc(100dvh - 18px)}.panel,.scene{padding:11px;border-radius:17px}.panel{gap:20px}h1{font-size:20px}.count{font-size:36px}.step button{min-width:30px;padding:5px;font-size:19px}.step strong{font-size:17px}.action{padding:9px 3px;font-size:12px}.sky{min-height:360px}.sub{font-size:11px}}@media(prefers-reduced-motion:reduce){.bubble{animation:none}.fill{transition:none}}
</style></head><body>
<main class="layout"><aside class="panel"><div><h1>🫧 Bubbiq</h1><div class="sub">Little pops. Big progress.</div></div><div><div class="sub">Emails remaining</div><div class="count" id="remaining">12</div></div><div><label class="sub" for="range">Total emails</label><input type="range" id="range" min="0" max="100" value="12"><div class="sub">Drag to adjust</div></div><div class="step"><button id="minus" aria-label="Remove one email">−</button><strong id="total">12</strong><button id="plus" aria-label="Add one email">+</button></div><div class="actions"><button class="action" id="sound">♫ Sound on</button><button class="action" id="reset">↻ Start fresh</button></div></aside><section class="scene"><div class="heading"><div><h1>Your floating inbox ✨</h1><div class="sub">Pop a bubble each time you finish an email</div></div><span aria-hidden="true">💌</span></div><div class="stats"><div><strong id="done">0</strong> <span class="sub">completed</span></div><strong id="percent">0%</strong></div><div class="bar"><div class="fill" id="fill"></div></div><div class="sky" id="sky" aria-label="Floating email bubbles"></div><div class="foot" id="message">One little pop at a time 🌷</div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),sky=$('sky');let audio=null,serial=0;const key='bubbiq-progress-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch{}let count=Number.isInteger(saved?.count)?Math.max(0,Math.min(500,saved.count)):12;let done=Number.isInteger(saved?.done)?Math.max(0,Math.min(count,saved.done)):0;let soundOn=saved?.soundOn!==false;const live=new Map();function save(){try{localStorage.setItem(key,JSON.stringify({count,done,soundOn}))}catch{}}function chime(){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;[1046.5,1318.5,1568,2093].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),start=t+i*.06;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.065,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+.32);o.connect(g);g.connect(audio.destination);o.start(start);o.stop(start+.34)})}catch{}}function add(){const id=serial++,b=document.createElement('button');b.type='button';b.className='bubble';b.setAttribute('aria-label','Mark an email complete');b.style.left=(10+Math.random()*80)+'%';b.style.top=(10+Math.random()*80)+'%';const size=36+Math.random()*28;b.style.width=size+'px';b.style.height=size+'px';b.style.setProperty('--dx',(5+Math.random()*12)+'px');b.style.setProperty('--dy',(5+Math.random()*14)+'px');b.style.setProperty('--duration',(3+Math.random()*4)+'s');b.style.setProperty('--delay',(-Math.random()*6)+'s');b.addEventListener('click',()=>{if(b.classList.contains('popping'))return;chime();b.classList.add('popping');setTimeout(()=>{if(!live.has(id))return;live.delete(id);b.remove();done++;stats()},280)});live.set(id,b);sky.append(b)}function stats(){$('remaining').textContent=count-done;$('total').textContent=count;$('done').textContent=done;$('range').value=Math.min(100,count);const pct=count?Math.round(done/count*100):100;$('percent').textContent=pct+'%';$('fill').style.width=pct+'%';sky.querySelector('.finished')?.remove();if(live.size===0){const div=document.createElement('div');div.className='finished';div.innerHTML=count===0?'☁️<div>Clear skies!</div>':'🎉✨<div>Inbox conquered!</div>';sky.append(div)}$('message').textContent=count>0&&done===count?'You did it! Enjoy your inbox freedom 💜':done>0?'Look at you go! Keep popping ✨':'One little pop at a time 🌷';save()}function setCount(n){count=Math.max(0,Math.min(500,Math.round(n)));done=Math.min(done,count);const needed=count-done;while(live.size<needed)add();while(live.size>needed){const id=Array.from(live.keys()).pop();live.get(id).remove();live.delete(id)}stats()}$('plus').onclick=()=>setCount(count+1);$('minus').onclick=()=>setCount(count-1);$('range').oninput=e=>setCount(Number(e.target.value));$('reset').onclick=()=>{live.forEach(b=>b.remove());live.clear();done=0;for(let i=0;i<count;i++)add();stats()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♫ Sound on':'♪ Sound off';save()};$('sound').textContent=soundOn?'♫ Sound on':'♪ Sound off';for(let i=done;i<count;i++)add();stats()})();
</script></body></html>
