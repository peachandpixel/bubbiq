<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f2ff"><title>Bubbiq — Little pops, big progress</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#403753;background:#faf7ff}*{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,32px)}button,input{font:inherit}button{cursor:pointer}.layout{max-width:1300px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;min-height:calc(100dvh - 64px)}.panel,.scene{border:1px solid #e9dff5;border-radius:24px;padding:24px;background:#fff;box-shadow:0 8px 30px #8b75b40c}.panel{display:flex;flex-direction:column;gap:24px}.scene{display:flex;flex-direction:column;gap:14px;background:linear-gradient(145deg,#f9f2ff,#effbff 60%,#fff2f8)}h1{font-size:26px;margin:0}.sub{font-size:13px;color:#857795}.count{font-size:52px;font-weight:800;line-height:1.1}input[type=range]{width:100%;accent-color:#a58be8}.step{display:flex;align-items:center;justify-content:space-between;gap:8px}.step button,.action{border:1px solid #e5dbee;border-radius:12px;background:#faf7ff;color:#403753;padding:10px 14px}.step button{font-size:24px;min-width:46px}.step strong{font-size:23px}.actions{margin-top:auto;display:grid;gap:10px}.heading,.stats{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats strong{font-size:28px}.bar{height:11px;background:#e9e3f2;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ad90f3,#80d4dc);border-radius:20px;transition:width .3s}.sky{position:relative;flex:1;min-height:420px;overflow:hidden;border-radius:18px}.bubble{position:absolute;border-radius:50%;border:1px solid #ffffffcc;background:radial-gradient(circle at 28% 24%,#fff 0%,#ffffff55 18%,transparent 43%),radial-gradient(circle at 70% 80%,#e9b9f4,#a8e0f0 48%,#b5a5f1 85%);box-shadow:inset -7px -8px 15px #6855a52a,inset 4px 4px 10px #ffffffb0,0 6px 18px #7764b42b;animation:drift var(--duration) ease-in-out infinite alternate;animation-delay:var(--delay);transform:translate(-50%,-50%);touch-action:manipulation;will-change:transform}.bubble:nth-child(3n){filter:hue-rotate(42deg)}.bubble:nth-child(4n){filter:hue-rotate(-26deg)}.bubble:hover{box-shadow:0 0 24px #b39bed99,inset 3px 4px 10px #fff}.bubble.popping{animation:burst .28s ease-out forwards!important;pointer-events:none}@keyframes drift{from{transform:translate(calc(-50% - var(--dx)),calc(-50% - var(--dy)))}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1}50%{transform:translate(-50%,-50%) scale(1.5);opacity:.8}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}.finished{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:24px;font-weight:750;pointer-events:none}.foot{text-align:center;color:#857795;font-size:13px}@media(max-width:650px){body{padding:9px}.layout{grid-template-columns:115px minmax(0,1fr);gap:8px;min-height:calc(100dvh - 18px)}.panel,.scene{padding:11px;border-radius:17px}.panel{gap:20px}h1{font-size:20px}.count{font-size:36px}.step button{min-width:30px;padding:5px;font-size:19px}.step strong{font-size:17px}.action{padding:9px 3px;font-size:12px}.sky{min-height:360px}.sub{font-size:11px}}@media(prefers-reduced-motion:reduce){.bubble{animation:none}.fill{transition:none}}

:root{--page:#faf7ff;--ink:#403753;--muted:#857795;--edge:#e9dff5;--panel:#fff;--button:#faf7ff;--scene-a:#f9f2ff;--scene-b:#effbff;--scene-c:#fff2f8;--bubble-a:#e9b9f4;--bubble-b:#a8e0f0;--bubble-c:#b5a5f1;--accent:#ad90f3;--accent2:#80d4dc}
body{background:var(--page);color:var(--ink)}.panel{background:var(--panel)}.panel,.scene{border-color:var(--edge)}.scene{background:linear-gradient(145deg,var(--scene-a),var(--scene-b) 60%,var(--scene-c))}.sub,.foot{color:var(--muted)}.step button,.action,.theme-select{background:var(--button);color:var(--ink);border-color:var(--edge)}input[type=range]{accent-color:var(--accent)}.fill{background:linear-gradient(90deg,var(--accent),var(--accent2))}.bubble{background:radial-gradient(circle at 28% 24%,#fff 0%,#ffffff55 18%,transparent 43%),radial-gradient(circle at 70% 80%,var(--bubble-a),var(--bubble-b) 48%,var(--bubble-c) 85%)}.theme-select{width:100%;border:1px solid;border-radius:12px;padding:11px 9px;font:inherit;cursor:pointer}.theme-label{display:block;margin-bottom:6px}.bubble:focus-visible,.action:focus-visible,.theme-select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style></head><body>
<main class="layout"><aside class="panel"><div><h1>🫧 Bubbiq</h1><div class="sub">Little pops. Big progress.</div></div><div><div class="sub">Emails remaining</div><div class="count" id="remaining">12</div></div><div><label class="sub" for="range">Total emails</label><input type="range" id="range" min="0" max="100" value="12"><div class="sub">Drag to adjust</div></div><div class="step"><button id="minus" aria-label="Remove one email">−</button><strong id="total">12</strong><button id="plus" aria-label="Add one email">+</button></div><div class="actions"><div><label class="sub theme-label" for="theme">🎨 Bubble theme</label><select class="theme-select" id="theme"><option value="original">Original iridescent</option><option value="ocean">Ocean Mist</option><option value="sage">Sage Garden</option><option value="cloud">Cloud Nine</option><option value="peach">Peachy Glow</option></select></div><button class="action" id="sound">♫ Sound on</button><button class="action" id="reset">↻ Start fresh</button></div></aside><section class="scene"><div class="heading"><div><h1>Your floating inbox ✨</h1><div class="sub">Pop a bubble each time you finish an email</div></div><span aria-hidden="true">💌</span></div><div class="stats"><div><strong id="done">0</strong> <span class="sub">completed</span></div><strong id="percent">0%</strong></div><div class="bar"><div class="fill" id="fill"></div></div><div class="sky" id="sky" aria-label="Floating email bubbles"></div><div class="foot" id="message">One little pop at a time 🌷</div></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),sky=$('sky'),key='bubbiq-progress-v1';
const themes={
original:{page:'#faf7ff',ink:'#403753',muted:'#857795',edge:'#e9dff5',button:'#faf7ff',a:'#f9f2ff',b:'#effbff',c:'#fff2f8',ba:'#e9b9f4',bb:'#a8e0f0',bc:'#b5a5f1',accent:'#ad90f3',accent2:'#80d4dc'},
ocean:{page:'#f2f9fb',ink:'#284c61',muted:'#668694',edge:'#d7e9ed',button:'#f0f9fc',a:'#eaf8fb',b:'#e8f4ff',c:'#effbf5',ba:'#a9d8e8',bb:'#b7ded3',bc:'#afc8df',accent:'#81b9d6',accent2:'#8bcfbe'},
sage:{page:'#f7f7f0',ink:'#445747',muted:'#798b75',edge:'#e1e8da',button:'#f5f7ef',a:'#f4f8ef',b:'#eef7f0',c:'#fcf7eb',ba:'#b9cdb1',bb:'#d8ceac',bc:'#b7c4a8',accent:'#9bb994',accent2:'#d5c8a1'},
cloud:{page:'#f6f7ff',ink:'#414765',muted:'#7a82a2',edge:'#e1e4f5',button:'#f5f6ff',a:'#f1f1ff',b:'#eaf7ff',c:'#f5f0ff',ba:'#b7c4ef',bb:'#b8d6e9',bc:'#d0c8ee',accent:'#9faee5',accent2:'#a5cfe7'},
peach:{page:'#fff9f4',ink:'#684b4a',muted:'#a1847d',edge:'#f0e0d5',button:'#fff7f1',a:'#fff3e8',b:'#fff9ed',c:'#fff0ef',ba:'#f2be9d',bb:'#e8c9a5',bc:'#d6b7b3',accent:'#e6ab90',accent2:'#e2c49d'}
};
let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch{}
let count=Number.isInteger(saved?.count)?Math.max(0,Math.min(100,saved.count)):12;
let done=Number.isInteger(saved?.done)?Math.max(0,Math.min(count,saved.done)):0;
let soundOn=saved?.soundOn!==false,theme=themes[saved?.theme]?saved.theme:'original';
let audio=null,serial=0;const live=new Map();
function save(){try{localStorage.setItem(key,JSON.stringify({count,done,soundOn,theme}))}catch{}}
function applyTheme(){const t=themes[theme],r=document.documentElement.style;Object.entries({'--page':t.page,'--ink':t.ink,'--muted':t.muted,'--edge':t.edge,'--button':t.button,'--scene-a':t.a,'--scene-b':t.b,'--scene-c':t.c,'--bubble-a':t.ba,'--bubble-b':t.bb,'--bubble-c':t.bc,'--accent':t.accent,'--accent2':t.accent2}).forEach(([k,v])=>r.setProperty(k,v));$('theme').value=theme;document.querySelector('meta[name="theme-color"]').content=t.page;}
// Build the whole sparkle chime once, so popping does not create four oscillators.
let sparkleBuffer=null;
function getAudio(){
 if(!soundOn)return null;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!audio||audio.state==='closed'){audio=new AC({latencyHint:'interactive'});sparkleBuffer=null;}
  if(!sparkleBuffer){
   const rate=audio.sampleRate,length=Math.ceil(rate*.55);
   sparkleBuffer=audio.createBuffer(1,length,rate);
   const data=sparkleBuffer.getChannelData(0);
   [1046.5,1318.5,1568,2093].forEach((freq,n)=>{
    const start=Math.floor(n*.052*rate),duration=Math.floor(.29*rate);
    for(let i=0;i<duration&&start+i<length;i++){
     const t=i/rate,attack=Math.min(1,t/.012),decay=Math.pow(1-t/.29,2);
     data[start+i]+=Math.sin(2*Math.PI*freq*t)*attack*decay*.12;
    }
   });
  }
  return audio;
 }catch{return null;}
}
function chime(){
 if(!soundOn)return;
 const ctx=getAudio();if(!ctx||!sparkleBuffer)return;
 try{
  // Both resume and start happen within the same trusted pointer gesture.
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const source=ctx.createBufferSource();source.buffer=sparkleBuffer;
  source.connect(ctx.destination);source.start(0);
 }catch{}
}
function wakeAudio(){const ctx=getAudio();if(ctx?.state==='suspended')ctx.resume().catch(()=>{});}
// Prepare on first interaction; bubble sound itself is started on pointerdown.
document.addEventListener('pointerdown',wakeAudio,{capture:true,passive:true});
document.addEventListener('keydown',wakeAudio,{capture:true});
function bubbleSize(){// Fixed bubble size, independent of email count.
return Math.min(56,Math.max(36,(sky.clientWidth||700)*.095));}
function sizeBubble(b){const variation=Number(b.dataset.variation||1);const px=Math.round(bubbleSize()*variation);b.style.width=px+'px';b.style.height=px+'px';}
function add(){const id=serial++,b=document.createElement('button');b.type='button';b.className='bubble';b.setAttribute('aria-label','Mark an email complete');b.dataset.variation=(.82+Math.random()*.36).toFixed(3);b.style.left=(14+Math.random()*72)+'%';b.style.top=(15+Math.random()*70)+'%';sizeBubble(b);b.style.setProperty('--dx',(4+Math.random()*9)+'px');b.style.setProperty('--dy',(4+Math.random()*11)+'px');b.style.setProperty('--duration',(3+Math.random()*4)+'s');b.style.setProperty('--delay',(-Math.random()*6)+'s');b.addEventListener('pointerdown',()=>{if(!b.classList.contains('popping'))chime()},{passive:true});b.addEventListener('click',e=>{if(b.classList.contains('popping'))return;if(e.detail===0)chime();b.classList.add('popping');setTimeout(()=>{if(!live.has(id))return;live.delete(id);b.remove();done++;stats()},280)});live.set(id,b);sky.append(b)}
function stats(){$('remaining').textContent=count-done;$('total').textContent=count;$('done').textContent=done;$('range').value=count;const pct=count?Math.round(done/count*100):100;$('percent').textContent=pct+'%';$('fill').style.width=pct+'%';sky.querySelector('.finished')?.remove();if(live.size===0){const div=document.createElement('div');div.className='finished';div.innerHTML=count===0?'☁️<div>Clear skies!</div>':'🎉✨<div>Inbox conquered!</div>';sky.append(div)}$('message').textContent=count>0&&done===count?'You did it! Enjoy your inbox freedom 💜':done>0?'Look at you go! Keep popping ✨':'One little pop at a time 🌷';save()}
function setCount(n){count=Math.max(0,Math.min(100,Math.round(n)));done=Math.min(done,count);const needed=count-done;while(live.size<needed)add();while(live.size>needed){const id=Array.from(live.keys()).pop();live.get(id).remove();live.delete(id)}// Keep all bubbles at their original fixed size.
live.forEach(sizeBubble);stats()}
$('plus').onclick=()=>setCount(count+1);$('minus').onclick=()=>setCount(count-1);$('range').oninput=e=>setCount(Number(e.target.value));
$('reset').onclick=()=>{live.forEach(b=>b.remove());live.clear();done=0;for(let i=0;i<count;i++)add();stats()};
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'♫ Sound on':'♪ Sound off';if(soundOn)getAudio();save()};
$('theme').onchange=e=>{theme=e.target.value;applyTheme();save()};
$('sound').textContent=soundOn?'♫ Sound on':'♪ Sound off';applyTheme();for(let i=done;i<count;i++)add();stats();
// Adjust for a resized window, but not when bubbles are popped.
if('ResizeObserver'in window){new ResizeObserver(()=>live.forEach(sizeBubble)).observe(sky)}
})();
</script></body></html>
